plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.example'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework:spring-aspects'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework:spring-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters', '-Xlint:deprecation']
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'live' }
}

// 실제 DB/Redis 쓰기 검증은 기본 test와 분리한다. 실행 전 대상·영향 승인이 필요하다.
tasks.register('liveAuthTest', Test) {
    group = 'verification'
    description = '이미 기동한 승인된 local A/B 서버의 쿠키·공유 인증을 검증한다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
}

// DDL 실행 전용이며 bootRun/웹 서버/개발 키 생성을 실행하지 않는다.
tasks.register('migrateDatabase', JavaExec) {
    group = 'application'
    description = '명시한 외부 대상의 승인된 migration을 독립 history 순서로 적용한다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.starter.common.persistence.MigrationMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// 개인 PC 실행에서만 local을 명시한다. 일반 bootRun과 공유 환경에는 기본값을 추가하지 않는다.
tasks.register('bootRunLocal', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = '준비된 로컬 PostgreSQL·Redis에 기본 테스트 자격으로 연결한다.'
    mainClass = tasks.named('bootRun').flatMap { it.mainClass }
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    environment 'SPRING_PROFILES_ACTIVE', 'local'
}

tasks.named('wrapper') {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
}
