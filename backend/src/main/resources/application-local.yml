server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: local-session
        secure: false
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:25432/starter_local}
    username: ${DB_USERNAME:testuser}
    password: ${DB_PASSWORD:1234}
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      username: ${REDIS_USERNAME:testuser}
      password: ${REDIS_PASSWORD:1234}
      ssl:
        enabled: false
app:
  public-origin: ${APP_PUBLIC_ORIGIN:http://localhost:3000}
