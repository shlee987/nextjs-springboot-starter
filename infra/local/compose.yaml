name: starter-project
services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_DB: starter_local
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: "1234"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U testuser -d starter_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
  redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    ports:
      - "127.0.0.1:26379:6379"
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=1234 redis-cli --user testuser ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
volumes:
  postgres-data:
  redis-data:
